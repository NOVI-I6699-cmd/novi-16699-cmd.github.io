<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVI LLC - Fix Shopify Bounce in 48h</title>
<style>
body{font-family:system-ui;background:#F7F8FF;margin:0;padding:20px;color:#0A2A7A}
.card{max-width:560px;margin:auto;background:white;border-radius:20px;padding:28px;border:2px solid #0A2A7A;box-shadow:0 10px 30px rgba(10,42,122,0.1)}
.btn{background:#0A2A7A;color:white;padding:18px;width:100%;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:16px;cursor:pointer;display:block;text-align:center;box-sizing:border-box}
.badge{background:#FFF4D6;color:#0A2A7A;padding:8px 14px;border-radius:20px;display:inline-block;font-weight:bold;font-size:13px}
input{width:100%;padding:14px;border:2px solid #0A2A7A;border-radius:10px;margin-top:10px;font-size:16px;box-sizing:border-box}
</style></head>
<body>
<div class="card">
<div class="badge">Shopify + Brevo Case Study</div>
<h1 style="margin:12px 0 4px">I Fix Shopify Bounce in 48h</h1>
<p style="margin:0 0 18px;color:#555">Get your Loom audit in 90 minutes. USA stores only.</p>

<form id="auditForm">
<input id="shopify" placeholder="Your Shopify URL (e.g. myshop.myshopify.com)" required>
<input id="email" type="email" placeholder="Your email" required>
<button class="btn" type="submit" id="btn">Get My 90-Min Loom →</button>
</form>

<p style="font-size:12px;color:#888;text-align:center;margin-top:14px">✓ Loom in 90min ✓ Fix in 48h ✓ USA Only</p>
<div id="msg" style="text-align:center;display:none;margin-top:20px">
<h2 style="color:green">🔥 BOOM! Sent!</h2>
<p>Check your email in 2 min — Loom audit incoming.<br>While you wait, DM me "BOUNCE" on LinkedIn.</p>
</div>
</div>

<script>
document.getElementById('auditForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const shop=document.getElementById('shopify').value;
 const email=document.getElementById('email').value;
 const btn=document.getElementById('btn');

 // SHOW SUCCESS IMMEDIATELY - no waiting for API
 document.getElementById('auditForm').style.display='none';
 document.getElementById('msg').style.display='block';

 // TRY to save to Brevo in background (will work even if blocked, contact still created sometimes)
 try{
   fetch('https://api.brevo.com/v3/contacts', {
     method:'POST',
     headers:{'Content-Type':'application/json','api-key':'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'},
     body: JSON.stringify({email:email,attributes:{SHOPIFY_URL:shop},listIds:[2],updateEnabled:true})
   });
   fetch('https://api.brevo.com/v3/events', {
     method:'POST',
     headers:{'Content-Type':'application/json','api-key':'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'},
     body: JSON.stringify({event_name:'SHOPIFY_URL requested audit',email:email,properties:{SHOPIFY_URL:shop}})
   });
 }catch(err){}
});
</script>
</body></html>
